# Render Blueprint — a free, one-click deployment of Nexus Quest.
#
# Render is used here rather than a serverless platform because this is not a serverless
# application: it holds WebSocket presence connections open, streams SSE, and runs a 1 Hz
# presence tick and a background scheduler in-process. On a per-request serverless runtime the
# live map, the ops feed, the single-use QR nonce cache and the in-memory rate limiters all
# stop working — the REST API would answer and the interesting half would not.
#
# Deploying this:
#
#   1. Create a free MongoDB Atlas M0 cluster and copy its connection string. It must be
#      Atlas (or any replica set), not a standalone `mongod`: the bilateral swap and the
#      cyclic rotation use `session.withTransaction`, and MongoDB only offers multi-document
#      transactions on a replica set. A standalone boots fine and then fails those paths at
#      runtime, which is a confusing way to find out. Add 0.0.0.0/0 to the cluster's network
#      access list, because Render's outbound addresses are not fixed on the free plan.
#   2. On Render: New → Blueprint, point it at this repository. It reads this file.
#   3. Paste the Atlas string into the `MONGODB_URI` value when Render asks. It is the only
#      value marked `sync: false`, which is what makes Render prompt for it rather than
#      commit it — the connection string contains a password and does not belong in git.
#
# The three application secrets are generated by Render, not written here. `src/config/env.ts`
# refuses to boot in production if any of them still holds its committed default, so a
# deployment that skipped this step fails loudly at start rather than quietly serving forgeable
# tokens.
#
# **The free plan sleeps after 15 minutes idle**, and the next request takes roughly a minute
# to wake it. For a live demo, open the URL a couple of minutes before you need it. `npm run
# demo` on a laptop has no such delay and needs no network, which is why the README still
# treats that as the primary way to see this running.

services:
  - type: web
    name: nexus-quest
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # `/ready` reports the Mongoose connection state and 503s when the database is not
    # connected, so an instance that cannot reach Atlas is never marked healthy. `/health` is
    # deliberately not used here: it answers 200 whenever the process is alive, which is the
    # right answer for liveness and the wrong one for "should this receive traffic".
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      # Production refuses to boot in `legacy` mode. That mode believes a `?volunteerId=`
      # query parameter, which is the documented open-demo contract and has no business on a
      # public URL.
      - key: AUTH_MODE
        value: required
      # Render terminates TLS at one proxy in front of this process. At 0 every client
      # resolves to that proxy's address and shares one rate-limit bucket; higher than the
      # real hop count would let a client spoof `X-Forwarded-For` and evade the limits.
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: SESSION_SECRET
        generateValue: true
      - key: QR_HMAC_SECRET
        generateValue: true
      - key: ORGANIZER_SECRET
        generateValue: true
      # Yours to paste: the Atlas connection string. `sync: false` keeps it out of this file.
      - key: MONGODB_URI
        sync: false
      # Used to build magic-link URLs. Set it to the service's own Render URL once it exists.
      - key: PUBLIC_URL
        sync: false
