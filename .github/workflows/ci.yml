name: WaveShift Nexus CI

on:
  push:
    branches: [ main, master, 'hardening/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck TypeScript
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Validate content packs (UIUC + example-campus fixture)
      run: |
        npm run content:validate
        CONTENT_PACK=example-campus npm run content:validate

    - name: CSP audit (no inline scripts, no external origins)
      run: npm run csp:audit

    - name: Campus pack check (schema, tile hashes, monument ids — offline)
      run: npm run campus:check

    - name: Frontend verification (syntax, tokens, material lockstep, winding audit)
      run: scripts/verify.sh quick

    - name: Live-event bridge (every emitted type forwarded, every subscription real)
      run: npm run events:check

    - name: Plan exit gates (every milestone's mechanism still present)
      run: npm run gates:check

    - name: Run Test Suite (Concurrency, Invariants, Swaps, Attendance, Identity, Content, Campus, Presence, Ops, Economy)
      run: npm test

    - name: Dependency audit (advisory)
      run: npm audit --audit-level=high || true
